[project]
name = "sermon-visuals"
version = "0.1.0"
description = "Turn archived sermon / radio-program audio into artwork, quote cards, thumbnails and YouTube-ready video."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "google-genai>=3.0",
    "openai>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sermon-visuals = "sermon_visuals.cli:main"

[tool.setuptools.packages.find]
include = ["sermon_visuals*"]

[tool.setuptools.package-data]
sermon_visuals = ["prompts/*.md", "config.example.toml"]
