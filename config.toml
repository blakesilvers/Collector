# Fish Window Cleaning – Tyler: bid / RFP collector configuration.

sources = ["esbd", "sam", "pages"]
radius_miles = 120
output_dir = "reports"
cache_dir = ".cache"
database = "data/rfps.sqlite"

[office]
name = "Fish Window Cleaning – Tyler (5400 University Blvd, Ste 5, Tyler TX 75707)"
state = "TX"
# OpenStreetMap geocode of University Blvd, Tyler TX 75707 (within ~1 mile of the suite).
lat = 32.3144
lon = -95.2386

[matching]
# Janitorial/custodial contracts sometimes include window cleaning. Off by
# default because there are many; turn on here or with --include-related.
include_related = false
min_score = 2
# Extra phrases to treat as a strong match (case-insensitive, literal).
extra_keywords = []
# Titles containing any of these are dropped (case-insensitive, literal).
exclude = []

[sam]
# Free key: SAM.gov > sign in > Account Details > API Key. The SAM_API_KEY
# environment variable takes precedence over this value.
api_key = ""
posted_within_days = 90
# NAICS 561720 Janitorial Services (includes window cleaning).
# NAICS 561790 Other Services to Buildings and Dwellings (includes pressure washing).
naics = ["561720", "561790"]
psc = []
title_keywords = []
max_pages_per_query = 3

# Buyers whose names don't contain their city, or contain a misleading one
# ("Stephen F. Austin" is in Nacogdoches, not Austin). Substring match on
# agency name + title; value is "City, ST" or "lat,lon".
[agency_locations]
"Stephen F. Austin" = "Nacogdoches, TX"
"Stephen F Austin" = "Nacogdoches, TX"
